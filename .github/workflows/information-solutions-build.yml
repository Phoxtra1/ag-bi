name: Build Information Solutions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, information-solutions-rebuild]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
