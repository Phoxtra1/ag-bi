name: Deploy Appwrite Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Deploy Appwrite Functions using CLI
        run: |
          npm install -g appwrite-cli
          cd functions/sendWelcomeEmail
          npm install
          appwrite functions deploy --functionId ${{ secrets.FUNCTION_ID_SEND_WELCOME }} --projectId ${{ secrets.APPWRITE_PROJECT_ID }} --key ${{ secrets.APPWRITE_API_KEY }}
          
          cd ../notifyAdmin
          npm install
          appwrite functions deploy --functionId ${{ secrets.FUNCTION_ID_NOTIFY_ADMIN }} --projectId ${{ secrets.APPWRITE_PROJECT_ID }} --key ${{ secrets.APPWRITE_API_KEY }}
