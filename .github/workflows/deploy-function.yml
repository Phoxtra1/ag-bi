name: Deploy Cloud Functions to Upright

on:
  push:
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-function.yml'
    branches:
      - main

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ secrets.UPRIGHT_PROJECT_ID }}
      ENDPOINT: ${{ secrets.UPRIGHT_API_ENDPOINT }}
      API_KEY: ${{ secrets.UPRIGHT_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Appwrite CLI
        run: npm install -g appwrite

      - name: Deploy Functions
        run: |
          cd functions
          for dir in */ ; do
            cd "$dir"
            echo "Deploying function in $dir"
            appwrite functions deploy \
              --projectId "$PROJECT_ID" \
              --endpoint "$ENDPOINT" \
              --key "$API_KEY"
            cd ..
          done
