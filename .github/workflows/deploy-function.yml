name: Deploy Appwrite Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.0

      - name: Deploy Appwrite Function - Login
        run: |
          npx appwrite client \
            --endpoint ${{ secrets.APPWRITE_ENDPOINT }} \
            --project ${{ secrets.APPWRITE_PROJECT_ID }} \
            --key ${{ secrets.APPWRITE_API_KEY }}

          npx appwrite functions createDeployment \
            --functionId ${{ secrets.FUNCTION_ID }} \
            --entrypoint "index.ts" \
            --code "./functions/login" \
            --activate true
