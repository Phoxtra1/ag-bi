
name: Deploy Appwrite Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      - name: Configure Appwrite CLI
        run: |
          appwrite client \
            --endpoint ${{ secrets.APPWRITE_ENDPOINT }} \
            --project-id ${{ secrets.APPWRITE_PROJECT_ID }} \
            --self-signed false

      - name: Deploy Login Function
        run: |
          appwrite functions createDeployment \
            --function-id ${{ secrets.LOGIN_FUNCTION_ID }} \
            --code ./functions/auth \
            --activate true \
            --entrypoint login.js
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}

      - name: Deploy Register Function  
        run: |
          appwrite functions createDeployment \
            --function-id ${{ secrets.REGISTER_FUNCTION_ID }} \
            --code ./functions/auth \
            --activate true \
            --entrypoint register.js
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
